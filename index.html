<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kirti Verma | AI Dreamer & Cartoonist</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family: "Trebuchet MS", Arial, sans-serif;
    background:#fff9ef;
    color:#20202b;
    line-height:1.6;
}

nav{
    position:fixed;
    top:0;
    width:100%;
    padding:16px 7%;
    background:rgba(255,249,239,.92);
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    border-bottom:3px solid #20202b;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#ff5c7a;
}

nav a{
    color:#20202b;
    text-decoration:none;
    margin-left:18px;
    font-weight:bold;
}

nav a:hover{
    color:#ff5c7a;
}

/* HERO */

.hero{
    min-height:100vh;
    padding:130px 8% 80px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 10% 20%,#ffd966 0 9%,transparent 10%),
        radial-gradient(circle at 90% 25%,#8ee3ef 0 10%,transparent 11%),
        radial-gradient(circle at 15% 85%,#ff9fb3 0 9%,transparent 10%),
        #fff9ef;
    position:relative;
    overflow:hidden;
}

.doodle{
    position:absolute;
    font-size:45px;
    opacity:.7;
}

.d1{top:22%;left:8%;transform:rotate(-15deg)}
.d2{top:35%;right:8%;transform:rotate(18deg)}
.d3{bottom:12%;right:15%;transform:rotate(-10deg)}
.d4{bottom:18%;left:15%;transform:rotate(12deg)}

.hero-box{
    max-width:900px;
}

.tag{
    display:inline-block;
    padding:8px 18px;
    border:3px solid #20202b;
    border-radius:30px;
    background:#ffd966;
    font-weight:bold;
    transform:rotate(-2deg);
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(48px,9vw,90px);
    line-height:.95;
    margin-bottom:20px;
    text-shadow:4px 4px 0 #ffd966;
}

.hero h1 span{
    color:#ff5c7a;
}

.hero p{
    max-width:700px;
    margin:auto;
    font-size:19px;
    font-weight:600;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 28px;
    background:#20202b;
    color:white;
    text-decoration:none;
    border-radius:14px;
    font-weight:bold;
    border:3px solid #20202b;
    box-shadow:5px 5px 0 #ff5c7a;
    transition:.2s;
}

.btn:hover{
    transform:translate(3px,3px);
    box-shadow:2px 2px 0 #ff5c7a;
}

/* SECTIONS */

section{
    padding:100px 8%;
}

.title{
    text-align:center;
    font-size:42px;
    margin-bottom:50px;
}

.title span{
    color:#ff5c7a;
}

/* ABOUT */

.about-card{
    max-width:900px;
    margin:auto;
    padding:35px;
    background:white;
    border:3px solid #20202b;
    border-radius:25px;
    box-shadow:9px 9px 0 #8ee3ef;
    position:relative;
}

.about-card h3{
    font-size:27px;
    margin-bottom:15px;
}

.bubble{
    display:inline-block;
    background:#ffd966;
    padding:7px 14px;
    border:2px solid #20202b;
    border-radius:20px;
    margin:8px 5px 0 0;
    font-weight:bold;
}

/* SKILLS */

.skills{
    max-width:950px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:22px;
}

.skill{
    background:white;
    border:3px solid #20202b;
    border-radius:20px;
    padding:28px;
    text-align:center;
    box-shadow:7px 7px 0 #ffd966;
    transition:.25s;
}

.skill:hover{
    transform:translateY(-8px) rotate(-1deg);
}

.icon{
    font-size:45px;
    margin-bottom:10px;
}

/* STORY */

.story{
    max-width:850px;
    margin:auto;
}

.chapter{
    background:white;
    border:3px solid #20202b;
    border-radius:20px;
    padding:25px;
    margin-bottom:22px;
    position:relative;
}

.chapter:nth-child(1){
    box-shadow:7px 7px 0 #ff9fb3;
}

.chapter:nth-child(2){
    box-shadow:7px 7px 0 #8ee3ef;
}

.chapter:nth-child(3){
    box-shadow:7px 7px 0 #ffd966;
}

.chapter small{
    font-weight:900;
    color:#ff5c7a;
}

/* GOAL */

.goal{
    background:#20202b;
    color:white;
    text-align:center;
}

.goal .title{
    color:white;
}

.goal-card{
    max-width:750px;
    margin:auto;
    padding:35px;
    border:3px solid white;
    border-radius:25px;
    background:#292938;
}

.goal-card h3{
    color:#ffd966;
    font-size:30px;
    margin-bottom:12px;
}

/* ACHIEVEMENTS */

.achievements{
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.achievement{
    background:white;
    padding:25px;
    border:3px solid #20202b;
    border-radius:20px;
    text-align:center;
}

.achievement span{
    font-size:45px;
}

/* CONTACT */

.contact{
    text-align:center;
    background:#ffd966;
}

.contact p{
    font-size:18px;
    font-weight:bold;
}

.social{
    margin-top:25px;
}

.social a{
    display:inline-block;
    margin:8px;
    padding:12px 18px;
    background:white;
    color:#20202b;
    text-decoration:none;
    border:3px solid #20202b;
    border-radius:12px;
    font-weight:bold;
}

.social a:hover{
    background:#ff5c7a;
    color:white;
}

    background:#
